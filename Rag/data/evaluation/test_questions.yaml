questions:
  - question: "How many annual leave days do full-time employees receive?"
    expected_source: "leave_policy.pdf"
    expected_answer: "18 days"
  - question: "How far in advance should annual leave be requested?"
    expected_source: "leave_policy.pdf"
    expected_answer: "At least three working days"
  - question: "How many days can be carried forward?"
    expected_source: "leave_policy.pdf"
    expected_answer: "Up to five annual leave days"
  - question: "How many work-from-home days are allowed each week?"
    expected_source: "work_from_home_policy.pdf"
    expected_answer: "Up to two days per workweek"
  - question: "Is manager approval needed for working from home?"
    expected_source: "work_from_home_policy.pdf"
    expected_answer: "Yes, the employee must request it through the manager"
  - question: "What must employees do while working from home?"
    expected_source: "work_from_home_policy.pdf"
    expected_answer: "Remain available, attend meetings, and use approved communication tools"
  - question: "When are employees eligible for medical insurance?"
    expected_source: "conduct_and_benefits_policy.pdf"
    expected_answer: "After completing three months"
  - question: "How should suspected conduct violations be reported?"
    expected_source: "conduct_and_benefits_policy.pdf"
    expected_answer: "Report them to Human Resources"
  - question: "What is required for expense reimbursement?"
    expected_source: "conduct_and_benefits_policy.pdf"
    expected_answer: "Pre-approval, receipts, and an expense report within 30 days"
  - question: "Does the policy define an internet allowance?"
    expected_source: "none"
    expected_answer: "The approved policy documents do not provide that information"
