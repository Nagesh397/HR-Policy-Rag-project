<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HR Policy Assistant</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #172033;
      --muted: #6b7280;
      --line: #d9e0ea;
      --panel: #ffffff;
      --soft: #f4f7fb;
      --accent: #1d6fe8;
      --accent-dark: #1557bb;
    }

    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 32px 20px 20px;
      background: linear-gradient(145deg, #eef5ff 0%, #f8fafc 48%, #eef8f5 100%);
      color: var(--ink);
      font-family: "Segoe UI", Tahoma, sans-serif;
    }
    .app-shell { max-width: 820px; min-height: calc(100vh - 52px); margin: 0 auto; display: flex; flex-direction: column; }
    .hero { margin-bottom: 22px; }
    .eyebrow { margin: 0 0 10px; color: var(--accent); font-size: 12px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
    h1 { margin: 0 0 8px; font-size: clamp(28px, 5vw, 42px); letter-spacing: -0.03em; }
    .muted { color: var(--muted); }
    .hero .muted { max-width: 560px; margin: 0; font-size: 16px; line-height: 1.6; }
    .chat-panel { padding: 20px; background: rgba(255, 255, 255, 0.82); border: 1px solid rgba(217, 224, 234, 0.9); border-radius: 16px; box-shadow: 0 16px 40px rgba(35, 55, 85, 0.08); }
    .panel-label { margin: 0 0 12px; color: var(--muted); font-size: 13px; font-weight: 700; }
    #messages { min-height: 300px; max-height: 52vh; overflow-y: auto; padding: 6px 4px; }
    #messages > .muted { padding: 92px 20px; text-align: center; }
    .message { margin: 14px 0; white-space: pre-wrap; line-height: 1.55; }
    .user { padding: 12px 15px; color: #174b96; background: #e9f2ff; border-radius: 12px 12px 3px 12px; font-weight: 600; }
    .answer { padding: 15px; background: var(--soft); border: 1px solid #e4eaf2; border-radius: 3px 12px 12px 12px; }
    form { display: flex; gap: 10px; margin-top: 16px; }
    input { min-width: 0; flex: 1; padding: 13px 15px; color: var(--ink); background: var(--panel); border: 1px solid #bfcbdc; border-radius: 9px; font: inherit; font-size: 16px; outline: none; }
    input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(29, 111, 232, 0.14); }
    button { padding: 13px 22px; border: 0; border-radius: 9px; background: var(--accent); color: white; font: inherit; font-weight: 700; cursor: pointer; transition: background 160ms ease, transform 160ms ease; }
    button:hover { background: var(--accent-dark); transform: translateY(-1px); }
    button:disabled { background: #9caebe; cursor: wait; transform: none; }
    .sources { margin-top: 10px; color: var(--muted); font-size: 13px; }
    footer { margin-top: auto; padding-top: 28px; color: var(--muted); font-size: 12px; text-align: center; }

    @media (max-width: 520px) {
      body { padding: 22px 14px 16px; }
      .app-shell { min-height: calc(100vh - 38px); }
      .chat-panel { padding: 14px; border-radius: 12px; }
      form { flex-direction: column; }
      button { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="hero">
      <p class="eyebrow">Employee support</p>
      <h1>HR Policy Assistant</h1>
      <p class="muted">Ask questions about the approved HR policy documents and get clear, source-backed answers.</p>
    </header>
    <main class="chat-panel">
      <p class="panel-label">Ask a policy question</p>
      <div id="messages"><p class="muted">Your answers will appear here.</p></div>
      <form id="chat-form">
        <input id="question" placeholder="e.g. What is the work from home policy?" required />
        <button id="send" type="submit">Ask question</button>
      </form>
    </main>
    <footer>Copyright GenAi_July@Team1.com</footer>
  </div>
  <script>
    const form = document.getElementById("chat-form");
    const questionInput = document.getElementById("question");
    const messages = document.getElementById("messages");
    const sendButton = document.getElementById("send");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const question = questionInput.value.trim();
      if (!question) return;
      messages.innerHTML += `<div class="message user">You: ${escapeHtml(question)}</div>`;
      questionInput.value = "";
      sendButton.disabled = true;
      try {
        const response = await fetch("http://localhost:8000/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || "The backend could not answer.");
        const sources = data.sources.map(source => `${source.document}, page ${source.page || "unknown"}`).join("; ");
        messages.innerHTML += `<div class="message answer">${escapeHtml(data.answer)}<div class="sources">Sources: ${escapeHtml(sources)}</div></div>`;
      } catch (error) {
        messages.innerHTML += `<div class="message answer">Error: ${escapeHtml(error.message)}</div>`;
      } finally {
        sendButton.disabled = false;
        questionInput.focus();
      }
    });

    function escapeHtml(value) {
      const element = document.createElement("div");
      element.textContent = value;
      return element.innerHTML;
    }
  </script>
</body>
</html>
